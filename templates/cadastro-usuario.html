<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='cadastro-usuario.css') }}" />
</head>

<body>

    <form action="{{ url_for('auth.cadastrar_usuario') }}" method="POST">
        <h1>Cadastro de Usuário</h1>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% if mensagens %}
                {% for categoria, mensagem in mensagens %}
                    <div class="flash {{ categoria }}">{{ mensagem }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <label for="nome">Nome:</label>
        <!-- ATIVIDADE 1 — ITEM 4: mantém o valor após erro de validação -->
        <input type="text" id="nome" name="nome" required
               value="{{ request.form.get('nome', '') }}" />

        <label for="cpf">CPF:</label>
        <!-- ATIVIDADE 2 — ITEM 1: placeholder indica o formato esperado -->
        <input type="text" id="cpf" name="cpf" maxlength="14" required
               placeholder="000.000.000-00"
               value="{{ request.form.get('cpf', '') }}" />

        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade" required min="0"
               value="{{ request.form.get('idade', '') }}" />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required
               value="{{ request.form.get('email', '') }}" />

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required />

        <label>Perfil</label>
        <select name="perfil">
                <option value="comum">Usuário comum</option>
                <option value="admin">Administrador</option>
        </select>
        </select>

        <button type="submit">Cadastrar</button>

        <div class="link-area">
            <a href="{{ url_for('auth.login') }}">Já tenho cadastro — Fazer login</a>
        </div>
    </form>

    <script>
        // ATIVIDADE 2 — ITEM 1: máscara automática de CPF
        const cpfInput = document.getElementById('cpf');

        cpfInput.addEventListener('input', function () {
            let valor = this.value.replace(/\D/g, ''); // remove tudo que não é dígito

            if (valor.length > 3)  valor = valor.slice(0, 3) + '.' + valor.slice(3);
            if (valor.length > 7)  valor = valor.slice(0, 7) + '.' + valor.slice(7);
            if (valor.length > 11) valor = valor.slice(0, 11) + '-' + valor.slice(11);
            if (valor.length > 14) valor = valor.slice(0, 14);

            this.value = valor;
        });
    </script>

</body>
</html>
